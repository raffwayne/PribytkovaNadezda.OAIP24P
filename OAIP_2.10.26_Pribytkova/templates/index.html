<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фильмы</title>
</head>
<body>

<h1>Мои фильмы</h1>

{% for movie in movies %}
    <h2>{{ movie.title }}</h2>
    <p>Год: {{ movie.year }}</p>
    {% if movie.rating >= 8.5 %}
    <p><b>Рекомендуем посмотреть</b></p>
    {% endif %}
    <a href="/movie/{{ movie.id }}">Подробнее</a>

{% endfor %}

</body>
</html>
